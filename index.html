          <li><strong>Official IANA Timezone &amp; DST Accuracy:</strong> Handles Daylight Saving Time transitions (23-hour spring-forward and 25-hour fall-back days) as well as 30-minute and 45-minute offset zones (such as India IST +5:30 and Nepal +5:45).</li>
          <li><strong>1-Click Calendar &amp; Slack Sharing:</strong> Drag across any hours on the timeline to export an RFC 5545 <code>.ics</code> invite, open a pre-filled Google Calendar event, or copy a formatted Slack/Teams snippet.</li>
