<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="18" fill="#0f172a" />
  <!-- Stacked Time Rows -->
  <rect x="10" y="14" width="44" height="8" rx="4" fill="#334155" />
  <rect x="22" y="14" width="20" height="8" rx="4" fill="url(#glow)" />

  <rect x="10" y="28" width="44" height="8" rx="4" fill="#1e293b" />
  <rect x="26" y="28" width="18" height="8" rx="4" fill="url(#emerald)" />

  <rect x="10" y="42" width="44" height="8" rx="4" fill="#334155" />
  <rect x="18" y="42" width="24" height="8" rx="4" fill="url(#glow)" />

  <!-- Magnetic Overlap Alignment Pillar -->
  <rect x="26" y="10" width="14" height="44" rx="3" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
